[package]
name = "cutting"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
thiserror = "1.0"
color-eyre = "0.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

walkdir = { workspace = true }

# For the command enum pattern
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
strum = { version = "0.26", features = ["derive"] }
strum_macros = "0.26"
schemars = "0.8"
toml = "0.8"

# GStreamer support
gstreamer = { version = "0.24", features = ["serde"] }
gstreamer-app = "0.24"  
gstreamer-video = "0.24"
gstreamer-audio = "0.24"
gstreamer-editing-services = "0.24.0"
gstreamer-pbutils = "0.24.0"

# macOS NSApplication support
[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.25"
objc = "0.2"

# Subtitle integration
tokio = { version = "1.0", features = ["full"], optional = true }

subtitles = { workspace = true, optional = true, features = ["schemars"] }
video_kit_common = { path = "../video_kit_common" }

# No features needed - GStreamer is the only backend


